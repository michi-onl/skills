# Wikipedia Translation Rules (enwiki ↔ dewiki)
# Case-insensitive matching assumed. Swap keys/values for de→en.

templates:
  simple:
    Steady: Unverändert; Up: Gestiegen; Down: Gefallen; Increase: Gestiegen; 
    Decrease: Gefallen; Main: Hauptartikel; See also: Siehe auch; Official website: ""
  remove:
    [Short description, Use mdy dates, Use dmy dates, Use American English, 
     Use British English, Refimprove, More citations needed, Dynamic list, 
     pp-semi-indef, pp-semi, pp-move, pp-sock, Multiple image, further, 
     Good article, Featured article]
  infoboxes:
    Infobox company: Infobox Unternehmen; Infobox person: Infobox Person;
    Infobox settlement: Infobox Ort; Infobox album: Infobox Album;
    Infobox single: Infobox Single; Infobox film: Infobox Film;
    Infobox television: Infobox Fernsehsendung; Infobox software: Infobox Software;
    Infobox organization: Infobox Organisation; Infobox university: Infobox Hochschule;
    Infobox book: Infobox Buch; Infobox musical artist: Infobox Musiker;
    Infobox football biography: Infobox Fußballspieler

citations:
  to_internetquelle: [cite web, cite news, cite magazine, cite journal, cite press release, cite report]
  to_literatur: [cite book, cite arXiv, cite encyclopedia]
  params_internetquelle:
    url: url; title: titel; date: datum; access-date: abruf; accessdate: abruf;
    website: werk; work: werk; newspaper: werk; magazine: werk; journal: werk;
    publisher: hrsg; author: autor; first: vorname; last: nachname; language: sprache;
    quote: zitat; pages: seiten
  params_literatur:
    title: Titel; author: Autor; first: Vorname; last: Nachname; date: Datum; year: Jahr;
    journal: Sammelwerk; publisher: Verlag; location: Ort; isbn: ISBN; doi: DOI;
    pages: Seiten; edition: Auflage; eprint: arXiv; url: Online; access-date: Abruf;
    volume: Band; issue: Nummer
  remove_params: [archive-url, archive-date, url-status, url-access, via, issn, author-link, name-list-style, df]

link_mappings:
  patterns:
    (company): (Unternehmen); (magazine): (Magazin); (newspaper): (Zeitung);
    (band): (Band); (film): (Film); (TV series): (Fernsehserie); (programming language): (Programmiersprache)
  articles:
    United States: Vereinigte Staaten; United Kingdom: Vereinigtes Königreich;
    European Union: Europäische Union; New York City: New York City; California: Kalifornien;
    Artificial intelligence: Künstliche Intelligenz; Machine learning: Maschinelles Lernen;
    World War II: Zweiter Weltkrieg; World War I: Erster Weltkrieg; Nobel Prize: Nobelpreis;
    Academy Award: Oscar

localization:
  months:
    January: Januar; February: Februar; March: März; April: April; May: Mai; June: Juni;
    July: Juli; August: August; September: September; October: Oktober; November: November; December: Dezember
  numbers:
    decimal_en_to_de: { ".": "," }
    thousands_en_to_de: { ",": "." }
    exclude: [URLs, ISO-dates, Version numbers, DOIs, ISBNs]
  dashes:
    "—": "–"
  quotes:
    en_double: '""'
    de_double: '„“'
  namespaces:
    Category: Kategorie; File: Datei; Image: Bild; Template: Vorlage; Wikipedia: Wikipedia; Help: Hilfe; Portal: Portal; Draft: ""
  magic_words:
    DEFAULTSORT: SORTIERUNG; DISPLAYTITLE: SEITENTITEL
  image_params:
    thumb: mini; thumbnail: mini; right: rechts; left: links; center: zentriert; upright: hochkant; frame: gerahmt; frameless: rahmenlos; alt: alternativtext; border: rand

special_templates:
  abbr: extract_first_param
  URL: convert_to_extlink
  Unbulleted list: join_with_br
  hlist: join_with_comma
  plainlist: convert_to_list
  lang: extract_second_param
  convert: manual_conversion
  quote: { de_template: "Zitat", param_order: [text, source] }
  blockquote: { de_template: "Zitat" }
  reflist: "<references />"
  Reflist: "<references />"
  notelist: '<references group="Anm." />'
  Commons category-inline: Commonscat
  Commons category: Commonscat
  Authority control: Normdaten